name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: Select the version to increment such as major, minor, or patch
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      environment:
        description: Development publishes to GitHub Packages, Production publishes to nuget.org and GitHub Releases
        required: true
        default: Development
        type: choice
        options:
          - Development
          - Production

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  release:
    name: Release Package
    uses: grovegs/workflows/.github/workflows/package-release.yml@v1.4.2
    with:
      package-name: Behaviour Tree
      version-type: ${{ inputs.version-type }}
      runs-on: ubuntu-latest
      dotnet-project: src/GroveGames.BehaviourTree
      global-json-file: global.json
      directory-build-props: Directory.Build.props
      readme-file: README.md
      license-file: LICENSE
      godot-addon: src/GroveGames.BehaviourTree.Godot/addons/GroveGames.BehaviourTree
      unity-package: src/GroveGames.BehaviourTree.Unity/Packages/com.grovegames.behaviourtree
      create-tag: true
      publish-github: ${{ inputs.environment == 'Production' }}
      publish-nuget: ${{ inputs.environment == 'Production' }}
      publish-github-packages: ${{ inputs.environment == 'Development' }}
      publish-discord: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      client-id: ${{ secrets.CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
      nuget-api-key: ${{ secrets.NUGET_API_KEY }}
      discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
